# =============================================================
# WORKFLOW DE CD - Desplegament automàtic a Vercel
# =============================================================
# S'executa automàticament NOMÉS si el workflow "Tests" ha
# completat amb èxit a la branca main.
#
# Flux:
#
#  Workflow "Tests" completat amb èxit a main
#       │
#       ▼
#  ┌──────────────────────────────────┐
#  │  Checkout del codi               │
#  └─────────────┬────────────────────┘
#                │
#       ▼
#  ┌──────────────────────────────────┐
#  │  Deploy service-wishlist         │ ──── ERROR ──► FI ❌
#  │  (Vercel)                        │
#  └─────────────┬────────────────────┘
#                │ OK
#       ▼
#  ┌──────────────────────────────────┐
#  │  Deploy service-history          │ ──── ERROR ──► FI ❌
#  │  (Vercel)                        │
#  └─────────────┬────────────────────┘
#                │ OK
#       ▼
#     FI ✅ (serveis desplegats a producció)
#
# Secrets necessaris a GitHub (Settings > Secrets > Actions):
#   - VERCEL_TOKEN              → token personal de Vercel
#   - VERCEL_ORG_ID             → ID de l'organització/compte de Vercel
#   - VERCEL_PROJECT_ID_WISHLIST → ID del projecte service-wishlist
#   - VERCEL_PROJECT_ID_HISTORY  → ID del projecte service-history
# =============================================================

name: Deploy a Vercel

on:
  # Es dispara quan el workflow "Tests" acaba a la branca main
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Desplegament a Vercel
    runs-on: ubuntu-latest

    # Condició clau: només s'executa si els tests han passat correctament
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # Descarrega el codi del repositori
      - uses: actions/checkout@v4

      # Desplega service-wishlist a Vercel en mode producció
      # Utilitza l'acció oficial de Vercel per gestionar l'autenticació
      - name: Deploy service-wishlist a Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WISHLIST }}
          working-directory: ./service-wishlist
          vercel-args: '--prod'

      # Desplega service-history a Vercel en mode producció
      - name: Deploy service-history a Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_HISTORY }}
          working-directory: ./service-history
          vercel-args: '--prod'
